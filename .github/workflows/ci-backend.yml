name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'shortly-*-service/**'
      - 'shortly-shared-kernel/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'shortly-*-service/**'
      - 'shortly-shared-kernel/**'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test
