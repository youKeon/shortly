name: Docker Build & Push

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        service:
          - name: url-service
            context: .
            dockerfile: shortly-url-service/Dockerfile
            image: shortly-url-service
          - name: redirect-service
            context: .
            dockerfile: shortly-redirect-service/Dockerfile
            image: shortly-redirect-service
          - name: click-service
            context: .
            dockerfile: shortly-click-service/Dockerfile
            image: shortly-click-service
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image: shortly-frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21 (for backend services)
      if: matrix.service.name != 'frontend'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Gradle project (for backend services)
      if: matrix.service.name != 'frontend'
      run: |
        chmod +x gradlew
        ./gradlew clean build -x test

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.context }}
        file: ${{ matrix.service.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service.image }}:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
