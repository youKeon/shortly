version: '3.8'

services:
  url-service:
    image: ${DOCKER_HUB_USERNAME}/shortly-url-service:${IMAGE_TAG:-latest}
    container_name: url-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://${INFRA_PRIVATE_IP}:3306/shortly_url
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${INFRA_PRIVATE_IP}:9092
      SPRING_DATA_REDIS_HOST: ${INFRA_PRIVATE_IP}
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_OPTS: "-Xmx512m -Xms512m"
    networks:
      - shortly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redirect-service:
    image: ${DOCKER_HUB_USERNAME}/shortly-redirect-service:${IMAGE_TAG:-latest}
    container_name: redirect-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${INFRA_PRIVATE_IP}:9092
      SPRING_DATA_REDIS_HOST: ${INFRA_PRIVATE_IP}
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_OPTS: "-Xmx1g -Xms1g"
    networks:
      - shortly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  click-service:
    image: ${DOCKER_HUB_USERNAME}/shortly-click-service:${IMAGE_TAG:-latest}
    container_name: click-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://${INFRA_PRIVATE_IP}:3307/shortly_click
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${INFRA_PRIVATE_IP}:9092
      JAVA_OPTS: "-Xmx512m -Xms512m"
    networks:
      - shortly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: ${DOCKER_HUB_USERNAME}/shortly-frontend:${IMAGE_TAG:-latest}
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - url-service
      - redirect-service
      - click-service
    networks:
      - shortly-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  shortly-network:
    driver: bridge
