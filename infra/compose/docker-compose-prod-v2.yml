
services:
  mysql-url:
    image: mysql:8.0
    container_name: shortly-mysql-url
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: shortly_url
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_MAX_CONNECTIONS: 50
    ports:
      - "3306:3306"
    volumes:
      - mysql-url-data:/var/lib/mysql
      - ./mysql-init/url-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=50
      --innodb-log-file-size=64M
      --bind-address=0.0.0.0
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

  mysql-click:
    image: mysql:8.0
    container_name: shortly-mysql-click
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: shortly_click
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_MAX_CONNECTIONS: 50
    ports:
      - "3307:3306"
    volumes:
      - mysql-click-data:/var/lib/mysql
      - ./mysql-init/click-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=50
      --innodb-log-file-size=64M
      --bind-address=0.0.0.0
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: shortly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M

  kafka:
    image: apache/kafka:3.7.0
    container_name: shortly-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 384M

  url-service:
    image: ${DOCKER_USERNAME:-yukeon}/shortly-url-service:${IMAGE_TAG:-latest}
    container_name: shortly-url-service
    depends_on:
      - kafka
      - mysql-url
      - redis
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-url:3306/shortly_url?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: shortly
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_OPTS: >
        -Xmx256m
        -Xms256m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

  redirect-service:
    image: ${DOCKER_USERNAME:-yukeon}/shortly-redirect-service:${IMAGE_TAG:-latest}
    container_name: shortly-redirect-service
    depends_on:
      - kafka
      - redis
      - url-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      URL_SERVICE_URL: http://url-service:8081
      JAVA_OPTS: >
        -Xmx256m
        -Xms256m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

  click-service:
    image: ${DOCKER_USERNAME:-yukeon}/shortly-click-service:${IMAGE_TAG:-latest}
    container_name: shortly-click-service
    depends_on:
      - kafka
      - mysql-click
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-click:3306/shortly_click?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: shortly
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:-shortly_password}
      JAVA_OPTS: >
        -Xmx256m
        -Xms256m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

  nginx:
    image: ${DOCKER_USERNAME:-yukeon}/shortly-frontend:${IMAGE_TAG:-latest}
    container_name: shortly-nginx
    depends_on:
      - url-service
      - redirect-service
      - click-service
    ports:
      - "80:80"
      - "443:443"
    networks:
      - shortly-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'
        reservations:
          memory: 64M

networks:
  shortly-network:
    name: shortly-network
    driver: bridge

volumes:
  mysql-url-data:
    name: shortly-mysql-url-data
  mysql-click-data:
    name: shortly-mysql-click-data
  redis-data:
    name: shortly-redis-data
  kafka-data:
    name: shortly-kafka-data
